services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aff_cashback
      POSTGRES_USER: aff_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_bat_buoc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aff_user -d aff_cashback"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD_bat_buoc}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD_bat_buoc}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aff_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_bat_buoc}@postgres:5432/aff_cashback}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_bat_buoc}@redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/scripts/migrate.js"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aff_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_bat_buoc}@postgres:5432/aff_cashback}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_bat_buoc}@redis:6379/0}
      HOST: "0.0.0.0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3002}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/-/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
